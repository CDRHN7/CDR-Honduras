<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportar Programa | Castillo del Rey Honduras</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .contenedor {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 35px;
        }

        .encabezado h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .encabezado p {
            color: #666;
            line-height: 1.6;
        }

        .tarjeta {
            background: white;
            border-radius: 18px;
            padding: 30px 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .icono {
            font-size: 55px;
            text-align: center;
            margin-bottom: 10px;
        }

        .titulo {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #botonUbicacion {
            background: #222;
            color: white;
        }

        #botonCopiar {
            background: #e9e9e9;
            color: #222;
            display: none;
        }

        #botonFormulario {
            background: #222;
            color: white;
            display: none;
        }

        #botonUbicacion:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f1f1f1;
            text-align: center;
        }

        .coordenadas {
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
            margin: 15px 0;
        }

        .estado {
            text-align: center;
            margin-top: 15px;
            color: #666;
            line-height: 1.5;
        }

        .error {
            color: #b00020;
        }

        .exito {
            color: #16803c;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 20px 15px 40px;
            }

            .encabezado h1 {
                font-size: 27px;
            }

            .tarjeta {
                padding: 25px 20px;
            }

        }

    </style>
</head>

<body>

    <main class="contenedor">

        <div class="encabezado">

            <h1>Reportar Programa</h1>

            <p>
                Castillo del Rey Honduras
            </p>

        </div>


        <div class="tarjeta">

            <div class="icono">
                📍
            </div>

            <h2 class="titulo">
                Obtén la ubicación del programa
            </h2>

            <p class="descripcion">
                Estando en el lugar donde se realiza el programa,
                presiona el botón para obtener automáticamente
                las coordenadas de tu ubicación.
            </p>


            <button id="botonUbicacion">
                OBTENER MI UBICACIÓN
            </button>


            <div id="estado" class="estado"></div>


            <div id="resultado" class="resultado">

                <strong>
                    Tu ubicación:
                </strong>

                <div id="coordenadas" class="coordenadas">
                </div>


                <button id="botonCopiar">
                    COPIAR COORDENADAS
                </button>


                <button id="botonFormulario">
                    IR AL FORMULARIO
                </button>

            </div>

        </div>


        <a href="index.html" class="volver">
            ← Volver al inicio
        </a>

    </main>


    <script>

        const botonUbicacion =
            document.getElementById("botonUbicacion");

        const botonCopiar =
            document.getElementById("botonCopiar");

        const botonFormulario =
            document.getElementById("botonFormulario");

        const resultado =
            document.getElementById("resultado");

        const coordenadasElemento =
            document.getElementById("coordenadas");

        const estado =
            document.getElementById("estado");


        let coordenadas = "";


        botonUbicacion.addEventListener("click", function () {

            estado.className = "estado";

            estado.textContent =
                "Obteniendo tu ubicación...";

            botonUbicacion.disabled = true;


            if (!navigator.geolocation) {

                estado.className =
                    "estado error";

                estado.textContent =
                    "Tu navegador no permite obtener la ubicación.";

                botonUbicacion.disabled = false;

                return;
            }


            navigator.geolocation.getCurrentPosition(

                function (position) {

                    const latitud =
                        position.coords.latitude;

                    const longitud =
                        position.coords.longitude;


                    coordenadas =
                        latitud.toFixed(6) +
                        ", " +
                        longitud.toFixed(6);


                    coordenadasElemento.textContent =
                        coordenadas;


                    resultado.style.display =
                        "block";

                    botonCopiar.style.display =
                        "block";

                    botonFormulario.style.display =
                        "block";


                    estado.className =
                        "estado exito";

                    estado.textContent =
                        "¡Ubicación obtenida correctamente!";


                    botonUbicacion.disabled =
                        false;

                },


                function (error) {

                    botonUbicacion.disabled =
                        false;

                    estado.className =
                        "estado error";


                    if (error.code === 1) {

                        estado.textContent =
                            "No se permitió el acceso a la ubicación. " +
                            "Activa el permiso de ubicación en tu navegador.";

                    } else if (error.code === 2) {

                        estado.textContent =
                            "No fue posible determinar tu ubicación. " +
                            "Verifica que el GPS o la ubicación estén activados.";

                    } else if (error.code === 3) {

                        estado.textContent =
                            "La ubicación tardó demasiado. " +
                            "Intenta nuevamente.";

                    } else {

                        estado.textContent =
                            "Ocurrió un error al obtener la ubicación.";

                    }

                },


                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );

        });


        botonCopiar.addEventListener("click", function () {

            navigator.clipboard.writeText(coordenadas)

                .then(function () {

                    botonCopiar.textContent =
                        "✓ COORDENADAS COPIADAS";

                    estado.className =
                        "estado exito";

                    estado.textContent =
                        "Ahora abre el formulario y pega las coordenadas en " +
                        "\"Ubicación del programa\".";

                })

                .catch(function () {

                    estado.className =
                        "estado error";

                    estado.textContent =
                        "No se pudieron copiar automáticamente. " +
                        "Mantén presionadas las coordenadas para copiarlas.";

                });

        });


        botonFormulario.addEventListener("click", function () {

            window.open(
                "https://docs.google.com/forms/d/1u6oaay4VuT4RdH1Fl9MFPJ-GdMb7mIO170-69RZfcgc/viewform",
                "_blank"
            );

        });

    </script>

</body>
</html>
